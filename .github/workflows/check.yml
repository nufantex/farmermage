name: check

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - run: python check_status.py

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: views-${{ github.run_number }}
          path: views_*.csv
          retention-days: 90
          if-no-files-found: ignore

      - if: always()
        run: |
          git config user.name "nufantex"
          git config user.email "chat.nufantex@gmail.com"
          git add view_history.csv
          if ! git diff --cached --quiet; then
            git commit -m "chore: update view_history.csv"
            git pull --rebase origin main
            git push origin main
          fi
