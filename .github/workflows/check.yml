name: 每日 50 次檢查型農本色連結

on:
  # 由 Cloudflare Workers Cron (farmermage-cron) 每天 50 次穩定呼叫 workflow_dispatch 觸發，
  # 也可在 Actions 頁面手動點「Run workflow」執行。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依套件
        run: pip install httpx

      - name: 執行連線與瀏覽次數檢查
        run: python check_status.py

      - name: 上傳本次檢查結果 CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: views-${{ github.run_number }}
          path: views_*.csv
          retention-days: 90
          if-no-files-found: ignore

      - name: 將歷史紀錄寫回 view_history.csv
        if: always()
        run: |
          git config user.name "nufantex"
          git config user.email "chat.nufantex@gmail.com"
          git add view_history.csv
          if ! git diff --cached --quiet; then
            git commit -m "chore: update view_history.csv"
            git pull --rebase origin main
            git push origin main
          fi
